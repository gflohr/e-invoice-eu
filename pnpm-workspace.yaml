packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  '@parcel/watcher': false
  '@scarf/scarf': false
  bun: false
  esbuild: false
  inotify: false
linkWorkspacePackages: true
minimumReleaseAgeExclude:
  - js-yaml@5.2.2
  - brace-expansion@5.0.8
  - yargs@18.1.0
overrides:
  brace-expansion@<=5.0.7: ^5.0.8
  js-yaml@>=5.0.0 <=5.2.1: ^5.2.2
