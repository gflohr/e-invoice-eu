name: Docker Publish (DockerHub)

on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check release tag
        id: release
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^@e-invoice-eu/server@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#@e-invoice-eu/server@}" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Log into DockerHub
        if: steps.release.outputs.release == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Select platforms
        id: platforms
        run: |
          if [ "${{ steps.release.outputs.release }}" = "true" ]; then
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push FULL image
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ steps.platforms.outputs.platforms }}
          context: .
          file: ./apps/server/Dockerfile
          push: ${{ steps.release.outputs.release == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          load: ${{ steps.release.outputs.release != 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push SLIM image
        if: steps.release.outputs.release == 'true'
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ steps.platforms.outputs.platforms }}
          context: .
          file: ./apps/server/Dockerfile
          push: true
          build-args: WITH_LIBREOFFICE=false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}-slim
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:slim
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        env:
          TRIVY_SHOW_SUPPRESSED: 'true'
        with:
          version: latest
          image-ref: '${{ env.IMAGE_NAME }}:latest'
          format: table
          exit-code: '1'
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: ./.trivyignore

      - name: Rename .trivyignore
        run: mv ./.trivyignore ./.trivyignore.disabled

      - name: Re-run Trivy without ignore file
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: latest
          image-ref: '${{ env.IMAGE_NAME }}:latest'
          format: json
          vuln-type: os,library
          severity: CRITICAL,HIGH
          output: trivy-report.json
          skip-setup-trivy: true

      - name: Check for unnecessary .trivyignore entries
        run: |
          set -euo pipefail
          mv ./.trivyignore.disabled ./.trivyignore
          npx --yes trivy-ignore-check .trivyignore trivy-report.json
